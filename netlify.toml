[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The admin should never be cached, so edits to it show up right away.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Addresses from the old website that Google still knows about.
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/join"
  to = "https://legacy-x-jiujitsu.gymdesk.com/signup"
  status = 301

[[redirects]]
  from = "/check-in"
  to = "https://legacy-x-jiujitsu.gymdesk.com/login"
  status = 301
