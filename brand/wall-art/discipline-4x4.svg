<svg xmlns="http://www.w3.org/2000/svg" width="4in" height="4in" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.84" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="bandMask"><rect x="90" y="300" width="1020" height="320" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1200" height="1200" fill="#0a0a0a"/>
  <rect x="48" y="48" width="1104" height="1104" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
  <rect x="62" y="62" width="1076" height="1076" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1"/>

  <!-- belt band around the waist -->
  <g mask="url(#bandMask)">
    <path d="M90,372 Q600,432 1110,372 L1110,478 Q600,538 90,478 Z" fill="#f4f4f4"/>
    <g fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-dasharray="10 7">
      <path d="M90,386 Q600,446 1110,386"/>
      <path d="M90,402 Q600,462 1110,402"/>
      <path d="M90,425 Q600,485 1110,425"/>
      <path d="M90,448 Q600,508 1110,448"/>
      <path d="M90,464 Q600,524 1110,464"/>
    </g>
  </g>

  <!-- left tail -->
  <g transform="translate(562,470) rotate(24)">
    <rect x="-53" y="0" width="106" height="410" fill="#f4f4f4" stroke="#0a0a0a" stroke-width="6"/>
    <g stroke="#0a0a0a" stroke-width="2.5" stroke-dasharray="10 7">
      <line x1="-39" y1="20" x2="-39" y2="400"/><line x1="-23" y1="20" x2="-23" y2="400"/>
      <line x1="0" y1="20" x2="0" y2="400"/>
      <line x1="23" y1="20" x2="23" y2="400"/><line x1="39" y1="20" x2="39" y2="400"/>
    </g>
  </g>

  <!-- right tail with rank bar and four degrees -->
  <g transform="translate(640,470) rotate(-17)">
    <rect x="-53" y="0" width="106" height="430" fill="#f4f4f4" stroke="#0a0a0a" stroke-width="6"/>
    <g stroke="#0a0a0a" stroke-width="2.5" stroke-dasharray="10 7">
      <line x1="-39" y1="20" x2="-39" y2="250"/><line x1="-23" y1="20" x2="-23" y2="250"/>
      <line x1="0" y1="20" x2="0" y2="250"/>
      <line x1="23" y1="20" x2="23" y2="250"/><line x1="39" y1="20" x2="39" y2="250"/>
    </g>
    <rect x="-50" y="262" width="100" height="128" fill="#0a0a0a"/>
    <g fill="#f4f4f4">
      <rect x="-50" y="282" width="100" height="11"/>
      <rect x="-50" y="305" width="100" height="11"/>
      <rect x="-50" y="328" width="100" height="11"/>
      <rect x="-50" y="351" width="100" height="11"/>
    </g>
  </g>

  <!-- knot -->
  <g transform="translate(600,442)">
    <path d="M-92,-70 L92,-76 L98,74 L-96,80 Z" fill="#f4f4f4" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-92,-70 L-30,-72 L98,40 L98,74 L60,76 Z" fill="#e2e2e2" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round"/>
    <g fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-dasharray="10 7">
      <path d="M-62,-70 L88,58"/>
      <path d="M-30,-60 L90,44"/>
      <path d="M-80,-50 L-80,70"/>
      <path d="M86,-62 L88,24"/>
    </g>
  </g>

  <!-- wordmark -->
  <line x1="520" y1="958" x2="680" y2="958" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
  <text x="611" y="1080" text-anchor="middle" fill="#fff"
        font-family="'Avenir Next Condensed', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="112" letter-spacing="22">DISCIPLINE</text>
</svg>
