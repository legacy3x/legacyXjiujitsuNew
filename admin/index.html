<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Admin — Legacy X Jiu-Jitsu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #1a2346; --dark: #0d1220; --panel: #141b31; --blue: #3a8fd8; --purple: #6a3fa6;
  --white: #fff; --muted: rgba(255,255,255,0.6); --border: rgba(255,255,255,0.12);
  --ok: #4caf82; --err: #e57373;
  --ff-display: 'Barlow Condensed', sans-serif; --ff-body: 'Barlow', sans-serif;
}
body { font-family: var(--ff-body); background: var(--dark); color: var(--white); min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }

.belt { display: flex; height: 4px; }
.belt span { flex: 1; }
.belt span:nth-child(1) { background: #fff; } .belt span:nth-child(2) { background: var(--blue); }
.belt span:nth-child(3) { background: var(--purple); } .belt span:nth-child(4) { background: #8b5a2b; }
.belt span:nth-child(5) { background: #2c2c2c; } .belt span:nth-child(6) { background: #c0392b; }

.logo { font-family: var(--ff-display); font-weight: 900; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
.logo .x { color: var(--blue); }

.btn {
  font-family: var(--ff-display); font-weight: 700; font-size: 14px; letter-spacing: 1.5px;
  text-transform: uppercase; padding: 10px 18px; border: 1px solid var(--border);
  background: transparent; cursor: pointer; transition: background .15s, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--blue); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--purple); border-color: var(--purple); }
.btn-primary:hover:not(:disabled) { background: var(--blue); border-color: var(--blue); }
.btn-blue { background: var(--blue); border-color: var(--blue); }
.btn-sm { font-size: 12px; padding: 6px 10px; letter-spacing: 1px; }
.btn-danger:hover:not(:disabled) { border-color: var(--err); color: var(--err); }

.field-input {
  width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  padding: 10px 12px; font-size: 15px; line-height: 1.5; outline: none; resize: vertical; overflow: hidden;
}
.field-input:focus { border-color: var(--blue); }
.field-input.dirty { border-color: #d9a441; }

/* ── Login ── */
.login-wrap { min-height: calc(100vh - 4px); display: grid; place-items: center; padding: 24px 16px; }
.login-card { width: 100%; max-width: 380px; background: var(--navy); border-top: 3px solid var(--blue); padding: 36px 32px; }
.login-card h1 { font-family: var(--ff-display); font-weight: 900; font-size: 34px; text-transform: uppercase; margin: 18px 0 6px; }
.login-card p { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
.login-card label { display: block; font-family: var(--ff-display); font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.login-card .btn { width: 100%; margin-top: 20px; padding: 13px; }
.link-btn { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 14px; margin-top: 14px; }
.msg { font-size: 14px; margin-top: 14px; min-height: 1.4em; }
.msg.ok { color: var(--ok); } .msg.err { color: var(--err); }

/* ── App ── */
.topbar {
  position: sticky; top: 0; z-index: 10; background: rgba(13,18,32,0.96); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px; padding: 12px 20px; flex-wrap: wrap;
}
.topbar .spacer { flex: 1; }
.topbar .who { color: var(--muted); font-size: 14px; }
.status { font-size: 14px; color: var(--muted); }
.status.ok { color: var(--ok); } .status.err { color: var(--err); } .status.warn { color: #d9a441; }

.layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 70px); }
.sidebar { border-right: 1px solid var(--border); padding: 18px 0; background: var(--panel); }
.sidebar h2 { font-family: var(--ff-display); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 0 20px 10px; }
.page-link {
  display: block; width: 100%; text-align: left; background: none; border: none; border-left: 3px solid transparent;
  padding: 9px 20px; font-size: 15px; color: var(--muted); cursor: pointer;
}
.page-link:hover { color: var(--white); background: rgba(255,255,255,0.03); }
.page-link.active { color: var(--white); border-left-color: var(--blue); background: rgba(58,143,216,0.08); }
.page-link.sub { padding-left: 34px; }
.page-select { display: none; width: 100%; margin-bottom: 18px; }

.main { padding: 28px 32px 80px; max-width: 980px; }
.main-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
.main-head h1 { font-family: var(--ff-display); font-weight: 900; font-size: 38px; text-transform: uppercase; line-height: 1; }
.main-head a { color: var(--blue); font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
.hint code { background: rgba(255,255,255,0.08); padding: 1px 5px; }
.filter { max-width: 340px; margin-bottom: 26px; }

.section-title {
  font-family: var(--ff-display); font-weight: 800; font-size: 20px; letter-spacing: 1px; text-transform: uppercase;
  color: var(--blue); margin: 34px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.block { margin-bottom: 18px; }
.block > label, .item-field > label {
  display: block; font-family: var(--ff-display); font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
}
.list { background: var(--panel); border: 1px solid var(--border); padding: 16px; margin-bottom: 18px; }
.list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.list-head h3 { font-family: var(--ff-display); font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; }
.item { background: var(--navy); border-left: 3px solid var(--purple); padding: 14px 16px; margin-bottom: 10px; }
.item-head { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.item-head strong { font-family: var(--ff-display); letter-spacing: 1px; text-transform: uppercase; font-size: 14px; margin-right: auto; }
.item-field { margin-bottom: 10px; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0 10px; }
.loading { color: var(--muted); padding: 40px 0; }

@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .page-select { display: block; }
  .main { padding: 20px 16px 80px; }
  .topbar { padding: 10px 16px; }
}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="belt"><span></span><span></span><span></span><span></span><span></span><span></span></div>

<!-- Sign in / reset password -->
<section id="login" class="login-wrap" hidden>
  <div class="login-card">
    <div class="logo">Legacy <span class="x">X</span></div>
    <h1 id="login-title">Admin sign in</h1>
    <p id="login-sub">Edit the website's content.</p>

    <form id="signin-form">
      <label for="email">Email</label>
      <input id="email" class="field-input" type="email" autocomplete="username" required/>
      <label for="password">Password</label>
      <input id="password" class="field-input" type="password" autocomplete="current-password" required/>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <button class="link-btn" type="button" id="forgot-btn">Forgot password?</button>
    </form>

    <form id="newpass-form" hidden>
      <label for="newpass">New password</label>
      <input id="newpass" class="field-input" type="password" autocomplete="new-password" minlength="8" required/>
      <button class="btn btn-primary" type="submit">Save new password</button>
    </form>

    <div id="login-msg" class="msg" role="status"></div>
  </div>
</section>

<!-- Editor -->
<section id="app" hidden>
  <header class="topbar">
    <div class="logo">Legacy <span class="x">X</span></div>
    <span class="status" id="status" role="status"></span>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="btn" id="save-btn" disabled>Save changes</button>
    <button class="btn btn-primary" id="publish-btn">Publish site</button>
    <button class="btn btn-sm" id="signout-btn">Sign out</button>
  </header>
  <div class="layout">
    <nav class="sidebar"><h2>Pages</h2><div id="page-nav"></div></nav>
    <main class="main">
      <select class="field-input page-select" id="page-select" aria-label="Page"></select>
      <div class="main-head">
        <h1 id="page-title">—</h1>
        <a id="page-view" href="/" target="_blank" rel="noopener">View live page ↗</a>
      </div>
      <p class="hint">
        Save your edits, then press <strong>Publish site</strong> — the live site updates in about a minute.
        Formatting: <code>&lt;br/&gt;</code> new line · <code>&lt;em&gt;…&lt;/em&gt;</code> accent · <code>&lt;strong&gt;…&lt;/strong&gt;</code> bold · <code>&lt;a href="…"&gt;…&lt;/a&gt;</code> link.
      </p>
      <input class="field-input filter" id="filter" type="search" placeholder="Find on this page…" aria-label="Find on this page"/>
      <div id="editor"></div>
    </main>
  </div>
</section>

<script type="module" src="admin.js"></script>
</body>
</html>
